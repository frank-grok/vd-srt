<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video to SRT</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c30;--line:#27334d;--muted:#9eabc2;--accent:#8b9cff;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#121a2d);color:#eef2ff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:820px;margin:40px auto;padding:0 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:14px;background:#29345a;display:grid;place-items:center;font-size:22px}
h1{font-size:25px;margin:0}p{color:var(--muted);margin:5px 0}.card{background:#141c30;border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}
label{display:block;font-weight:650;margin:0 0 8px}input,select,button,textarea{font:inherit}input[type=file],input[type=password],select{width:100%;background:#0c1426;color:#eef2ff;border:1px solid var(--line);border-radius:10px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:12px;color:var(--muted);margin-top:7px}
button{border:0;border-radius:11px;padding:13px 18px;background:#8192ff;color:#081020;font-weight:750;cursor:pointer;width:100%;margin-top:15px}button:disabled{opacity:.5;cursor:wait}
#status{margin-top:12px;color:#cbd5e1;white-space:pre-wrap}.good{color:var(--green)!important}.error{color:#fca5a5!important}
textarea{width:100%;min-height:300px;resize:vertical;background:#0a1222;color:#e5e7eb;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.5}
.actions{display:flex;gap:10px}.actions button{flex:1}.secondary{background:#26334e;color:#eef2ff}.hidden{display:none}
small{color:var(--muted)}@media(max-width:600px){main{margin:24px auto}.grid{grid-template-columns:1fr}.card{padding:16px}.actions{flex-direction:column}}
</style></head>
<body><main>
<div class="brand"><div class="logo">🎬</div><div><h1>Video to SRT</h1><p>Turn your video's original speech into editable subtitles.</p></div></div>
<section class="card">
<label for="video">1. Choose video</label><input id="video" type="file" accept="video/*,.mkv,.mov,.mp4,.webm">
<div class="hint">Maximum upload: 500 MB. Audio is extracted on the server before transcription.</div>
</section>
<section class="card">
<div class="grid">
<div><label for="engine">2. AI engine</label><select id="engine"><option value="groq">Groq Whisper (recommended)</option><option value="gemini">Google Gemini 3.5 Transcribe</option></select></div>
<div><label for="language">3. Spoken language</label><select id="language"><option value="my" selected>Burmese</option><option value="en">English</option><option value="th">Thai</option><option value="auto">Auto detect</option></select></div>
</div>
<div style="margin-top:16px"><label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="Paste the selected provider's API key"><div class="hint">Key is sent only with this request and is not saved by this app. Never share your key with anyone.</div></div>
<button id="start">Generate subtitles</button><div id="status" role="status"></div>
</section>
<section class="card hidden" id="result">
<label>4. Review and edit SRT</label><textarea id="srt" spellcheck="false"></textarea>
<div class="actions"><button id="download">Download .SRT</button><button class="secondary" id="copy">Copy SRT</button></div>
<p class="hint" id="count"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let filename="subtitles.srt";
$("start").onclick=async()=>{
 const file=$("video").files[0],key=$("key").value.trim();
 if(!file){$("status").textContent="Please choose a video first.";return}
 if(!key){$("status").textContent="Please enter your API key.";return}
 const fd=new FormData();fd.append("video",file);fd.append("engine",$("engine").value);fd.append("api_key",key);fd.append("language",$("language").value);
 $("start").disabled=true;$("status").textContent="Uploading and transcribing… This may take a while for long videos.";$("status").className="";
 $("result").classList.add("hidden");
 try{
  const r=await fetch("/api/transcribe",{method:"POST",body:fd});
  const data=await r.json();if(!r.ok)throw new Error(data.detail||"Transcription failed");
  $("srt").value=data.srt;$("count").textContent=`Created ${data.count} subtitle segments. Please review names and timing before importing into CapCut.`;
  filename=(file.name.replace(/\.[^.]+$/,"")||"subtitles")+".srt";$("result").classList.remove("hidden");
  $("status").textContent="Transcription complete. Review the subtitles, then download your SRT.";$("status").className="good";
 }catch(e){$("status").textContent=e.message;$("status").className="error"}
 finally{$("start").disabled=false}
};
$("download").onclick=()=>{const blob=new Blob([$("srt").value],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)};
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("srt").value);$("status").textContent="SRT copied to clipboard.";$("status").className="good"};
</script></body></html>
